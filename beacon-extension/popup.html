<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<style>
:root {
  --primary: #dccfff;
  --primary-deep: #6f5bb5;
  --accent: #ffb067;
  --accent-deep: #a35a17;
  --bg: #f3eefe;
  --panel: rgba(255, 255, 255, 0.75);
  --ink: #2b2733;
  --ink-2: #4a4557;
  --ink-3: #8b8599;
  --line: rgba(111, 91, 181, 0.16);
  --line-2: rgba(111, 91, 181, 0.08);
  --olive: #4c7252;
  --olive-soft: #e3efe4;
  --sea: #44549e;
  --sea-soft: #e2e8fb;
  --gold: #9c5512;
  --gold-soft: #ffe5cc;
  --lilac-soft: #e9e0ff;
  --r-pill: 999px;
  --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: 360px;
  background:
    radial-gradient(280px 180px at 90% -10%, rgba(255, 176, 103, 0.25), transparent 65%),
    radial-gradient(320px 220px at -10% 110%, rgba(220, 207, 255, 0.7), transparent 65%),
    var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 13px;
  line-height: 1.5;
}

/* Header */
.header {
  display: flex; align-items: center; gap: 10px;
  padding: 13px 14px; border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.55);
}
.brand-mark {
  width: 28px; height: 28px; border-radius: 10px; flex-shrink: 0;
  background:
    radial-gradient(circle at 28% 26%, #ffd9b0, transparent 58%),
    linear-gradient(135deg, var(--primary) 0%, var(--primary-deep) 100%);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.5), 0 4px 12px rgba(111,91,181,.35);
}
.brand-name { font-weight: 800; font-size: 16px; letter-spacing: -0.01em; }
.brand-sub  { font-size: 11px; color: var(--ink-3); font-weight: 600; }

/* Body */
.body { padding: 12px 14px; }

/* Status bar */
.status-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: 8px; margin-bottom: 10px;
  background: var(--panel); border: 1px solid var(--line);
  font-size: 12px; color: var(--ink-2);
}
.dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--line); }
.dot.green  { background: var(--olive); }
.dot.amber  { background: var(--accent-deep); }
.dot.red    { background: #b4501e; }

/* Buttons */
button { font: inherit; cursor: pointer; }
.btn {
  display: inline-flex; align-items: center; gap: 5px;
  background: rgba(255, 255, 255, 0.8); border: 1px solid var(--line); border-radius: var(--r-pill);
  padding: 7px 13px; color: var(--ink-2); font-size: 12.5px; font-weight: 700;
  transition: background .15s ease, box-shadow .15s ease;
}
.btn:hover:not(:disabled) { background: #fff; box-shadow: 0 4px 12px rgba(111,91,181,.16); }
.btn:disabled { opacity: .45; cursor: default; }
.btn-primary {
  background: linear-gradient(135deg, #6f5bb5 0%, #5d49a4 100%);
  color: #fff; border-color: transparent;
  box-shadow: 0 6px 16px rgba(111,91,181,.35);
}
.btn-primary:hover:not(:disabled) { background: linear-gradient(135deg, #65519f 0%, #523f95 100%); }
.btn-block   { width: 100%; justify-content: center; }
.btn-ghost   { background: transparent; border-color: transparent; color: var(--ink-3); padding: 7px 9px; box-shadow: none; }
.btn-ghost:hover { background: rgba(255,255,255,.7); color: var(--ink); box-shadow: none; }

/* Action row */
.actions { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.actions .spacer { flex: 1; }

/* Queue banner */
.queue-banner {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 9px 11px; border-radius: 14px; margin-bottom: 10px;
  background: linear-gradient(135deg, rgba(255, 224, 192, 0.85), rgba(255, 229, 204, 0.6));
  border: 1px solid rgba(255, 176, 103, 0.55);
  font-size: 12px; font-weight: 700; color: var(--accent-deep);
}
.queue-banner.hidden { display: none; }

/* Lead list */
.lead-list {
  max-height: 264px; overflow-y: auto;
  display: flex; flex-direction: column; gap: 5px;
  margin-bottom: 10px;
}
.lead-item {
  display: flex; align-items: flex-start; gap: 8px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 9px 11px; cursor: pointer; transition: border-color .1s, background .1s;
}
.lead-item:hover { border-color: var(--primary-deep); }
.lead-item.checked { border-color: var(--primary-deep); background: var(--lilac-soft); }
.lead-item input[type=checkbox] { margin-top: 2px; flex-shrink: 0; accent-color: var(--primary-deep); }
.lead-body { min-width: 0; }
.lead-name { font-weight: 600; font-size: 13px; }
.lead-sub  { color: var(--ink-3); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lead-hint { color: var(--ink-3); font-size: 11px; margin-top: 2px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Pills */
.pill {
  display: inline-flex; align-items: center;
  padding: 1px 7px; border-radius: 999px; font-size: 10.5px;
  background: var(--line-2); color: var(--ink-2); margin-top: 4px;
}
.pill.olive  { background: var(--olive-soft); color: var(--olive); }
.pill.accent { background: var(--lilac-soft); color: var(--primary-deep); }
.pill.sea    { background: var(--sea-soft);    color: var(--sea); }
.pill.gold   { background: var(--gold-soft);   color: var(--gold); }

/* Empty state */
.empty {
  color: var(--ink-3); text-align: center;
  padding: 22px 14px; font-size: 12.5px; line-height: 1.6;
}
.empty b { color: var(--ink-2); }

/* Footer */
.footer {
  padding: 8px 14px; border-top: 1px solid var(--line);
  font-size: 11.5px; color: var(--ink-3);
  display: flex; align-items: center; justify-content: space-between;
}
.footer a { color: var(--primary-deep); cursor: pointer; text-decoration: none; font-weight: 600; }
.footer a:hover { text-decoration: underline; }

/* Settings panel */
.settings-panel {
  display: none; padding: 10px 14px 14px;
  border-top: 1px solid var(--line); background: var(--panel);
}
.settings-panel.show { display: block; }
.settings-panel label {
  display: block; font-size: 11px; color: var(--ink-3);
  text-transform: uppercase; letter-spacing: .04em;
  margin: 8px 0 4px;
}
.settings-panel input {
  width: 100%; background: rgba(255,255,255,.85); border: 1px solid var(--line); border-radius: var(--r-pill);
  padding: 7px 12px; font: inherit; color: var(--ink); font-size: 12.5px;
}
.settings-panel input:focus { outline: none; border-color: var(--primary-deep); box-shadow: 0 0 0 3px rgba(220,207,255,.65); }
.settings-hint { font-size: 11px; color: var(--ink-3); margin-top: 5px; line-height: 1.5; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="brand-mark"></div>
  <div>
    <div class="brand-name">Beacon</div>
    <div class="brand-sub">Sales Navigator Bridge</div>
  </div>
</div>

<!-- Main body -->
<div class="body">

  <!-- Page status -->
  <div class="status-bar">
    <div class="dot" id="status-dot"></div>
    <span id="status-text">Checking page…</span>
  </div>

  <!-- Queue banner (hidden until leads queued) -->
  <div class="queue-banner hidden" id="queue-banner">
    <span id="queue-text">— leads in queue</span>
    <button class="btn" id="btn-csv" disabled title="Download queue as CSV — drop it onto Beacon to import">CSV</button>
    <button class="btn btn-primary" id="btn-send" disabled>Send to Beacon</button>
  </div>

  <!-- Action row -->
  <div class="actions">
    <button class="btn" id="btn-scan">🔍 Scan page</button>
    <button class="btn btn-ghost" id="btn-clear">Clear queue</button>
    <div class="spacer"></div>
    <button class="btn" id="btn-open-beacon">Open Beacon ↗</button>
  </div>

  <!-- Lead list (shown after scan) -->
  <div id="lead-list" class="lead-list" style="display:none"></div>

  <!-- Empty / hint message -->
  <div class="empty" id="empty-msg">
    Navigate to a <b>Sales Navigator lead profile</b> or <b>search results page</b>, then click Scan.
  </div>

  <!-- Add selected button (shown after scan) -->
  <button class="btn btn-primary btn-block" id="btn-add" style="display:none">
    Add selected to queue
  </button>

</div>

<!-- Footer -->
<div class="footer">
  <a id="toggle-settings">⚙ Beacon URL</a>
  <span id="footer-hint"></span>
</div>

<!-- Settings panel -->
<div class="settings-panel" id="settings-panel">
  <label>Beacon app URL</label>
  <input type="url" id="beacon-url" placeholder="https://enzo-beacon.vercel.app/"/>
  <p class="settings-hint">
    Where your Beacon app is hosted. The extension opens this tab and injects imported leads directly into localStorage.
  </p>
  <div style="display:flex; gap:6px; margin-top:8px">
    <button class="btn btn-primary" id="btn-save-settings">Save</button>
    <button class="btn" id="btn-cancel-settings">Cancel</button>
  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
